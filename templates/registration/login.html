<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
    /*  OJOS */
const allEyes = document.querySelectorAll(".eyes span");
const mouths = document.querySelectorAll(".mouth");

const MAX_MOVE = 7;
let eyesLocked = false;

/* FOLLOW MOUSE */
document.addEventListener("mousemove", e => {
  if (eyesLocked) return;

  allEyes.forEach(eye => {
    const r = eye.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const angle = Math.atan2(dy, dx);

    eye.style.transform = `
      translate(
        ${Math.cos(angle) * MAX_MOVE}px,
        ${Math.sin(angle) * MAX_MOVE}px
      )
    `;
  });
});

/*  PARPADEO */
function blinkAll() {
  if (eyesLocked) return;

  gsap.to(allEyes, {
    scaleY: 0.15,
    duration: 0.1,
    yoyo: true,
    repeat: 1,
    ease: "power1.inOut",
    transformOrigin: "center"
  });
}

setInterval(blinkAll, 2600);

/* FORM ELEMENTS */
const emailInput = document.querySelector('input[type="email"]');
const passwordInput = document.querySelector('input[type="password"]');
const toggleBtn = document.querySelector(".password button");

/*  EMAIL → BOCA ABIERTA
 */
emailInput.addEventListener("input", () => {
  gsap.to(mouths, {
    scaleY: 1.6,
    scaleX: 1.2,
    duration: 0.15,
    transformOrigin: "center"
  });
});

/* cerrar boca al salir del email */
emailInput.addEventListener("blur", () => {
  gsap.to(mouths, {
    scaleY: 1,
    scaleX: 1,
    duration: 0.2
  });
});

/* PASSWORD → CERRAR BOCA */
passwordInput.addEventListener("focus", () => {
  gsap.to(mouths, {
    scaleY: 1,
    scaleX: 1,
    duration: 0.2
  });
});

/* VER PASSWORD */
toggleBtn.addEventListener("click", () => {
  const showing = passwordInput.type === "password";
  passwordInput.type = showing ? "text" : "password";

  if (showing) {
    // activar modo "no quiero ver"
    eyesLocked = true;

    gsap.to(allEyes, {
      x: -MAX_MOVE * 1.2,
      y: 0,
      duration: 0.2
    });
  } else {
    // volver a normal
    eyesLocked = false;

    gsap.to(allEyes, {
      x: 0,
      y: 0,
      duration: 0.25
    });
  }
});

</script>
